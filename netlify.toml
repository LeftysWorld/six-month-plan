# Netlify build settings, kept in the repo so the dashboard can't drift from them.
# The app is a static Vite build with #/ routes, so no redirect rules are needed.

[build]
  base = ""
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# The service worker and the manifest must never be served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
